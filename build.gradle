plugins {
    id 'java'
    id 'application'
}

group = 'com.beyonnex'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// --release instead of a toolchain: no second JDK download, still pinned to the 17 API.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
}

application {
    mainClass = 'com.beyonnex.anagram.cli.Main'
    // Pin the encoding instead of inheriting the platform default.
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

// Without this, gradle run does not forward stdin.
run {
    standardInput = System.in
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}
