name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test
        run: ./gradlew test

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  # Builds the image and drives a session through it, so the Dockerfile cannot rot unnoticed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t anagram:ci .

      - name: Run a session through it
        run: |
          output=$(printf 'check listen | silent\nfind listen\nquit\n' \
                   | docker run --rm -i anagram:ci)
          echo "$output"
          echo "$output" | grep -q '"listen" and "silent" ARE anagrams.'
          echo "$output" | grep -q -- '- silent'
